name: Build UnCast tipa

# 同一分支只保留一个运行，避免 macOS runner 配额被并发打满
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ main, master ]
    paths:
      - 'UnCast/**'
      - '.github/workflows/build.yml'
      - 'project.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: '打包模式'
        required: true
        default: 'unsigned'
        type: choice
        options:
          - unsigned
          - trollstore

jobs:
  build:
    name: Build tvOS App
    # 注意：macos-14 当前无法分配 runner（job 0 秒被 cancelled），
    # 用 macos-15（Xcode 16.x，含 tvOS 18 SDK，向下兼容 tvOS 15 部署目标）
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version and tvOS SDK
        run: |
          xcodebuild -version
          echo '---- available SDKs ----'
          xcodebuild -showsdks || true
          echo '---- tvOS SDK check ----'
          if xcodebuild -showsdks | grep -qi 'appletvos'; then
            echo 'OK: tvOS SDK present'
            xcodebuild -showsdks | grep -i 'appletvos' || true
          else
            echo 'WARN: no tvOS SDK reported by -showsdks'
          fi

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Install ldid (用于嵌入 entitlements 的 ad-hoc 签名)
        run: |
          # 关键：单纯 CODE_SIGNING_ALLOWED=NO 产出的二进制里**没有** entitlements，
          # 装到 tvOS 后 IP_ADD_MEMBERSHIP 会 EPERM，SSDP 收不到 M-SEARCH。
          # ldid -S 会做 ad-hoc 签名（不加密、不触发 FairPlay），
          # 并把 entitlements 写进 __TEXT,__entitlements 与 LC_CODE_SIGNATURE。
          brew install ldid || true
          which ldid && ldid --version || echo "ldid 不可用，将回退到 codesign --sign -"

      - name: Generate Xcode project
        run: |
          set -e
          echo "---- 仓库根目录 ----"
          ls -la
          echo "---- 生成工程 ----"
          xcodegen generate --spec project.yml
          echo "---- 生成结果 ----"
          ls -la UnCast.xcodeproj

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project UnCast.xcodeproj \
            -scheme UnCast \
            -configuration Release \
            -sdk appletvos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            VALIDATE_PRODUCT=NO \
            build 2>&1 | tee build.log

          echo "---- build result ----"
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log | tail -5

      - name: Locate .app bundle
        id: find_app
        run: |
          APP_PATH=$(find build -name "UnCast.app" -type d -maxdepth 6 | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app not found, listing build dir:"
            find build -maxdepth 4 -type d | head -50
            exit 1
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Package unsigned tipa
        run: |
          set -e
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          rm -rf Payload UnCast.tipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          echo "---- Payload content ----"
          ls -la Payload
          ls -la Payload/UnCast.app

          # 清理构建阶段可能的签名残留（未签名包不应有 _CodeSignature）
          rm -rf Payload/UnCast.app/_CodeSignature || true
          rm -f Payload/UnCast.app/embedded.mobileprovision || true

      - name: Ad-hoc sign with entitlements (multicast)
        run: |
          set -e
          BIN="Payload/UnCast.app/UnCast"
          ENT="UnCast/App/UnCast.entitlements"

          echo "---- entitlements 源文件 ----"
          cat "$ENT"

          if command -v ldid >/dev/null 2>&1; then
            echo "---- 用 ldid -S 做 ad-hoc 签名并嵌入 entitlements ----"
            ldid -S"$ENT" "$BIN"
          else
            # 回退：codesign ad-hoc 同样能嵌入 entitlements，且不加密
            echo "---- ldid 不可用，改用 codesign --sign - ----"
            codesign --force --sign - \
              --entitlements "$ENT" \
              --timestamp=none \
              "$BIN"
          fi

          echo "---- 签名后校验 ----"
          codesign -d --entitlements - "$BIN" 2>&1 | head -40 || true
          echo "---- 确认 cryptid 仍为 0（未加密）----"
          otool -l "$BIN" | grep -A4 LC_ENCRYPTION_INFO || echo "no encryption info"
          echo "---- 确认有 LC_CODE_SIGNATURE ----"
          otool -l "$BIN" | grep -A3 LC_CODE_SIGNATURE || true

      - name: Package tipa (after signing)
        run: |
          set -e
          # tipa 就是 zip，扩展名不同而已
          zip -qry UnCast.tipa Payload
          ls -lh UnCast.tipa

      - name: Verify tipa integrity
        run: |
          set -e
          echo "---- tipa 内容清单（前 30 项）----"
          unzip -l UnCast.tipa | head -30
          echo ""
          echo "---- 关键文件校验 ----"
          unzip -l UnCast.tipa | grep -E "Info.plist|/UnCast$" || true

          # 解回来比对，确认包没坏
          rm -rf verify && mkdir -p verify && cd verify && unzip -q ../UnCast.tipa

          if [ -f "Payload/UnCast.app/Info.plist" ]; then
            echo "✅ Info.plist 存在"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/UnCast.app/Info.plist
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/UnCast.app/Info.plist
            /usr/libexec/PlistBuddy -c "Print :CFBundleSupportedPlatforms" Payload/UnCast.app/Info.plist
          else
            echo "❌ Info.plist 缺失"
            exit 1
          fi

          echo "---- 架构校验 ----"
          lipo -info Payload/UnCast.app/UnCast || file Payload/UnCast.app/UnCast

          echo "---- 确认未加密（cryptid 必须为 0）----"
          ENC=$(otool -l Payload/UnCast.app/UnCast | grep -A4 LC_ENCRYPTION_INFO_64 | grep cryptid | awk '{print $2}' | head -1)
          if [ -z "$ENC" ]; then
            ENC=$(otool -l Payload/UnCast.app/UnCast | grep -A4 LC_ENCRYPTION_INFO | grep cryptid | awk '{print $2}' | head -1)
          fi
          echo "cryptid=${ENC:-none}"
          if [ -n "$ENC" ] && [ "$ENC" != "0" ]; then
            echo "❌ 包被加密（cryptid=$ENC），装到设备会崩溃"
            exit 1
          fi
          echo "✅ 未加密"

          echo "---- 确认 entitlements 已嵌入（组播必需）----"
          ENT_OUT=$(codesign -d --entitlements - Payload/UnCast.app/UnCast 2>&1 || true)
          echo "$ENT_OUT"
          if echo "$ENT_OUT" | grep -q "com.apple.developer.networking.multicast"; then
            echo "✅ com.apple.developer.networking.multicast 已嵌入"
          else
            echo "❌ 缺少多播 entitlement → 装到 tvOS 上 SSDP 会 EPERM，手机搜不到设备"
            exit 1
          fi
          if echo "$ENT_OUT" | grep -q "com.apple.security.network.server"; then
            echo "✅ com.apple.security.network.server 已嵌入"
          else
            echo "⚠️ 缺少 network.server"
          fi

          echo "---- 确认已签名（有 CodeResources 或 LC_CODE_SIGNATURE）----"
          if otool -l Payload/UnCast.app/UnCast | grep -q LC_CODE_SIGNATURE; then
            echo "✅ 存在 LC_CODE_SIGNATURE（ad-hoc 签名，未加密，TrollStore 可装）"
          else
            echo "❌ 无 LC_CODE_SIGNATURE"
            exit 1
          fi

      - name: Gate — verify artifact is installable on tvOS
        run: |
          # 这一步是唯一的「能装吗」判据。
          # 上面 xcodebuild 成功、zip 成功都不能证明包可用；
          # 真正决定因素是字节里的平台/加密状态/多播权限。
          python3 --version
          python3 scripts/check_tipa.py UnCast.tipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnCast-tipa
          path: UnCast.tipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7
          if-no-files-found: ignore